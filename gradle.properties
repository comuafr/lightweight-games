org.gradle.jvmargs=-Xmx2g
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

kotlin.code.style=official
kotlin.native.ignoreDisabledTargets=true

android.useAndroidX=true
android.enableR8.fullMode=true

# :androidApp (build-config note for PLAN.md §9 M0 part b) -----------------
# AGP 9.4.0's built-in Kotlin support (the default: no separate Kotlin
# plugin applied) bundles Kotlin Gradle Plugin 2.2.10. That compiler cannot
# read androidApp's dependency on `core`, built with Kotlin 2.4.20 (see
# gradle/libs.versions.toml): "was compiled with an incompatible version of
# Kotlin". AGP's own documented fix — declaring a newer kotlin-gradle-plugin
# on the root buildscript classpath to bump the built-in compiler — instead
# crashes AGP 9.4.0 itself while configuring :androidApp
# (NoClassDefFoundError: com.android.build.gradle.api.BaseVariant, thrown
# from inside AGP's own built-in-Kotlin integration code, not from anything
# in this project). Opting out of both built-in Kotlin and the new DSL lets
# androidApp apply org.jetbrains.kotlin.android explicitly instead (see
# androidApp/build.gradle.kts), pinned to the same 2.4.20 used everywhere
# else, which resolves the metadata mismatch without hitting that crash.
# Both properties are documented as temporary opt-outs, removed in AGP 10.0;
# revisit this whole block then. Does not affect core/, which never used
# built-in Kotlin or the application/library "new DSL" (it applies
# org.jetbrains.kotlin.multiplatform directly, plus AGP's Kotlin Multiplatform
# library plugin, whose own DSL is unaffected by these two properties).
android.builtInKotlin=false
android.newDsl=false

name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21' }
      - uses: gradle/actions/setup-gradle@v4
      - name: Core tests (JVM)
        run: ./gradlew :core:jvmTest --no-daemon
  android:
    runs-on: ubuntu-latest
    needs: core
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21' }
      # ubuntu-latest ships an Android SDK at $ANDROID_HOME with licenses accepted;
      # only the exact platform / build-tools we pin need to be present.
      - name: Install SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" "platform-tools" > /dev/null
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests + release APK + AAB + lint
        run: ./gradlew :androidApp:testDebugUnitTest :androidApp:assembleRelease :androidApp:bundleRelease :androidApp:lintRelease --no-daemon
      - name: Footprint report
        run: tools/footprint.sh
      - uses: actions/upload-artifact@v4
        with:
          name: android-release
          path: |
            androidApp/build/outputs/apk/release/*.apk
            androidApp/build/outputs/bundle/release/*.aab

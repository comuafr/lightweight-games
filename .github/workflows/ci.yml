name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21' }
      - uses: gradle/actions/setup-gradle@v4
      - name: Core tests (JVM)
        run: ./gradlew :core:jvmTest --no-daemon
  android:
    runs-on: ubuntu-latest
    needs: core
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21' }
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Assemble release APK
        run: ./gradlew :androidApp:assembleRelease --no-daemon
      - name: Footprint report
        run: tools/footprint.sh
      - uses: actions/upload-artifact@v4
        with: { name: android-release, path: androidApp/build/outputs/apk/release/*.apk }
  ios:
    # Optional: needs a macOS runner. Builds the XCFramework and runs XCTest.
    if: github.event_name == 'push'
    runs-on: macos-15
    needs: core
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21' }
      - name: Build XCFramework
        run: ./gradlew :core:assembleGamesCoreXCFrameworkRelease --no-daemon
      - name: XCTest
        run: |
          mkdir -p iosApp/Frameworks && cp -R core/build/XCFrameworks/release/GamesCore.xcframework iosApp/Frameworks/
          LG_USE_PREBUILT=1 xcodebuild test -project iosApp/LightweightGames.xcodeproj -scheme LightweightGames \
            -destination 'platform=iOS Simulator,name=iPhone 16' CODE_SIGNING_ALLOWED=NO | tail -50
